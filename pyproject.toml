[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pqc-corpus"
version = "1.0.0"
description = "Mine, filter and release the commits, issues and pull requests of PQC-Corpus"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Collecting a new run mines Git history with PyDriller; exporting and filtering need only the standard library.
collect = ["PyDriller==2.9", "GitPython==3.1.62", "gitdb==4.0.12", "smmap==5.0.3", "pytz==2026.3.post1",
           "lizard==1.24.0", "pathspec==1.1.1", "Pygments==2.21.0"]
figures = ["matplotlib>=3.8"]
test = ["jsonschema>=4.10"]

[project.scripts]
pqc-corpus = "pqc_corpus.cli:main"

[tool.setuptools.packages.find]
include = ["pqc_corpus*"]
